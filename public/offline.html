<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors ligne — Yüpixi</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAFAFC;
        color: #0F172A;
        font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card { max-width: 380px; }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #FE0000;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
      }
      .icon svg { width: 34px; height: 34px; }
      h1 { font-size: 1.3rem; font-weight: 800; margin: 0 0 0.6rem; }
      p { color: #64748B; font-size: 0.95rem; line-height: 1.5; margin: 0 0 1.5rem; }
      button {
        background: #FE0000;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 0.75rem 1.75rem;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" />
        </svg>
      </div>
      <h1>Pas de connexion</h1>
      <p>Yüpixi a besoin d'internet pour charger cette page. Vérifiez votre connexion et réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
