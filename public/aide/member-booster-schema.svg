<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Booster une annonce en 3 étapes</title>
  <desc id="d">1 : acheter des crédits par Mobile Money. 2 : choisir un boost. 3 : l’annonce passe devant, puis son bilan s’affiche.</desc>
  <rect width="720" height="340" rx="20" fill="#FFFFFF"/>
  <g>
    <rect x="20" y="20" width="210" height="96" rx="16" fill="#F6F3F2"/>
    <circle cx="52" cy="52" r="16" fill="#FE0000"/><text x="52" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
    <text x="78" y="50" font-size="15" font-weight="700" fill="#1C1B1B">Achetez des crédits</text>
    <text x="78" y="72" font-size="13" fill="#5E5E5E">Mobile Money</text>
    <text x="78" y="92" font-size="13" fill="#5E5E5E">1 crédit = 100 F*</text>
    <path d="M238 68 h20 m-7 -7 l7 7 l-7 7" stroke="#9E9E9E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="265" y="20" width="200" height="96" rx="16" fill="#F6F3F2"/>
    <circle cx="297" cy="52" r="16" fill="#FE0000"/><text x="297" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="323" y="50" font-size="15" font-weight="700" fill="#1C1B1B">Choisissez</text>
    <text x="323" y="70" font-size="15" font-weight="700" fill="#1C1B1B">un boost</text>
    <text x="323" y="92" font-size="13" fill="#5E5E5E">sur votre annonce</text>
    <path d="M473 68 h20 m-7 -7 l7 7 l-7 7" stroke="#9E9E9E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="500" y="20" width="200" height="96" rx="16" fill="#E3F5EC"/>
    <circle cx="532" cy="52" r="16" fill="#006947"/><text x="532" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="558" y="50" font-size="15" font-weight="700" fill="#1C1B1B">Elle passe</text>
    <text x="558" y="70" font-size="15" font-weight="700" fill="#1C1B1B">devant</text>
    <text x="558" y="92" font-size="13" fill="#5E5E5E">puis son bilan</text>
  </g>
  <!-- Before / after: the boosted card moves to the top with its pill. -->
  <text x="40" y="156" font-size="13" font-weight="700" fill="#5E5E5E">Avant</text>
  <g transform="translate(40 166)">
    <rect width="270" height="30" rx="8" fill="#F6F3F2"/><rect x="8" y="7" width="16" height="16" rx="4" fill="#E5E2E1"/><rect x="34" y="12" width="140" height="6" rx="3" fill="#E5E2E1"/>
    <rect y="38" width="270" height="30" rx="8" fill="#F6F3F2"/><rect x="8" y="45" width="16" height="16" rx="4" fill="#E5E2E1"/><rect x="34" y="50" width="110" height="6" rx="3" fill="#E5E2E1"/>
    <rect y="76" width="270" height="30" rx="8" fill="#F6F3F2"/><rect x="8" y="83" width="16" height="16" rx="4" fill="#E5E2E1"/><rect x="34" y="88" width="125" height="6" rx="3" fill="#E5E2E1"/>
    <rect y="114" width="270" height="30" rx="8" fill="#FFFFFF" stroke="#FE0000" stroke-width="2"/><rect x="8" y="121" width="16" height="16" rx="4" fill="#FFE3E3"/><text x="34" y="134" font-size="12" font-weight="700" fill="#1C1B1B">Votre annonce</text>
  </g>
  <path d="M335 240 h48 m-9 -9 l9 9 l-9 9" stroke="#FE0000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="410" y="156" font-size="13" font-weight="700" fill="#006947">Après le boost</text>
  <g transform="translate(410 166)">
    <rect width="270" height="30" rx="8" fill="#FFFFFF" stroke="#FE0000" stroke-width="2"/><rect x="8" y="7" width="16" height="16" rx="4" fill="#FFE3E3"/><text x="34" y="20" font-size="12" font-weight="700" fill="#1C1B1B">Votre annonce</text>
    <rect x="172" y="7" width="88" height="16" rx="4" fill="#006947"/><text x="216" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">EN VEDETTE</text>
    <rect y="38" width="270" height="30" rx="8" fill="#F6F3F2"/><rect x="8" y="45" width="16" height="16" rx="4" fill="#E5E2E1"/><rect x="34" y="50" width="140" height="6" rx="3" fill="#E5E2E1"/>
    <rect y="76" width="270" height="30" rx="8" fill="#F6F3F2"/><rect x="8" y="83" width="16" height="16" rx="4" fill="#E5E2E1"/><rect x="34" y="88" width="110" height="6" rx="3" fill="#E5E2E1"/>
    <rect y="114" width="270" height="30" rx="8" fill="#F6F3F2"/><rect x="8" y="121" width="16" height="16" rx="4" fill="#E5E2E1"/><rect x="34" y="126" width="125" height="6" rx="3" fill="#E5E2E1"/>
  </g>
  <text x="40" y="330" font-size="11" fill="#5E5E5E">* Valeur par défaut : le prix du crédit dans votre pays s’affiche à côté de chaque prix.</text>
</svg>
