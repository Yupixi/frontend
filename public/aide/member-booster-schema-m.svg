<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Booster une annonce en 3 étapes</title>
  <desc id="d">1 : acheter des crédits par Mobile Money. 2 : choisir un boost. 3 : l’annonce passe devant, puis son bilan s’affiche.</desc>
  <rect width="360" height="470" rx="18" fill="#FFFFFF"/>
  <rect x="16" y="16" width="328" height="62" rx="14" fill="#F6F3F2"/>
  <circle cx="44" cy="47" r="15" fill="#FE0000"/><text x="44" y="53" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
  <text x="70" y="42" font-size="16" font-weight="700" fill="#1C1B1B">Achetez des crédits</text>
  <text x="70" y="63" font-size="14" fill="#5E5E5E">Mobile Money · 1 crédit = 100 F*</text>
  <path d="M180 84 v12 m-6 -6 l6 6 l6 -6" stroke="#9E9E9E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="16" y="102" width="328" height="62" rx="14" fill="#F6F3F2"/>
  <circle cx="44" cy="133" r="15" fill="#FE0000"/><text x="44" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
  <text x="70" y="128" font-size="16" font-weight="700" fill="#1C1B1B">Choisissez un boost</text>
  <text x="70" y="149" font-size="14" fill="#5E5E5E">sur votre annonce</text>
  <path d="M180 170 v12 m-6 -6 l6 6 l6 -6" stroke="#9E9E9E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="16" y="188" width="328" height="62" rx="14" fill="#E3F5EC"/>
  <circle cx="44" cy="219" r="15" fill="#006947"/><text x="44" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
  <text x="70" y="214" font-size="16" font-weight="700" fill="#1C1B1B">Elle passe devant</text>
  <text x="70" y="235" font-size="14" fill="#5E5E5E">puis son bilan s’affiche</text>
  <text x="16" y="282" font-size="14" font-weight="700" fill="#006947">Après le boost</text>
  <g transform="translate(16 292)">
    <rect width="328" height="34" rx="8" fill="#FFFFFF" stroke="#FE0000" stroke-width="2"/><rect x="8" y="8" width="18" height="18" rx="4" fill="#FFE3E3"/><text x="36" y="22" font-size="14" font-weight="700" fill="#1C1B1B">Votre annonce</text>
    <rect x="218" y="8" width="100" height="18" rx="4" fill="#006947"/><text x="268" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">EN VEDETTE</text>
    <rect y="42" width="328" height="34" rx="8" fill="#F6F3F2"/><rect x="8" y="50" width="18" height="18" rx="4" fill="#E5E2E1"/><rect x="36" y="56" width="150" height="7" rx="3.5" fill="#E5E2E1"/>
    <rect y="84" width="328" height="34" rx="8" fill="#F6F3F2"/><rect x="8" y="92" width="18" height="18" rx="4" fill="#E5E2E1"/><rect x="36" y="98" width="120" height="7" rx="3.5" fill="#E5E2E1"/>
  </g>
  <text x="16" y="446" font-size="12" fill="#5E5E5E">* Par défaut : le prix du crédit de votre pays</text>
  <text x="16" y="462" font-size="12" fill="#5E5E5E">s’affiche à côté de chaque prix.</text>
</svg>
