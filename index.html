<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- First-visit market detection (src/lib/location.ts) -->
    <link rel="preconnect" href="https://ipwho.is" crossorigin />
    <link rel="manifest" href="/manifest.json?v=dilchap-3" />
    <meta name="theme-color" content="#FE0000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dilchap" />
    <meta name="application-name" content="Dilchap" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <title><!-- figma:title --></title>
    <script>
      // « Section Adultes »: its dark theme from the first paint for a
      // direct visit (src/lib/adultMode.ts, same storage keys): the space
      // this session is in; the storefront server's title for the section's
      // pages (« Contenu réservé aux adultes », Backend SeoService.adultMeta);
      // else what this device already knows: the section's slugs, adult
      // listings of this session.
      (function () {
        try {
          var p = location.pathname, on = sessionStorage.getItem('dilchap_adult_space') === '1', m, list
          var server = document.title.indexOf('Contenu réservé aux adultes') === 0
          if (on) { /* in the space */ } else if ((m = /^\/categorie\/([^/]+)/.exec(p))) {
            var slug = decodeURIComponent(m[1]).toLowerCase()
            list = JSON.parse(localStorage.getItem('dilchap_adult_slugs') || '[]')
            on = server || slug === (localStorage.getItem('dilchap_adult_root') || 'adultes') || list.indexOf(slug) >= 0
            if (server && list.indexOf(slug) < 0) { list.push(slug); localStorage.setItem('dilchap_adult_slugs', JSON.stringify(list)) }
          } else if ((m = /^\/annonce\/(?:.*-)?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.exec(p))) {
            var id = m[1].toLowerCase()
            list = JSON.parse(sessionStorage.getItem('dilchap_adult_ids') || '[]')
            on = server || list.indexOf(id) >= 0
            if (server && list.indexOf(id) < 0) { list.push(id); sessionStorage.setItem('dilchap_adult_ids', JSON.stringify(list)) }
          }
          if (!on) return
          document.documentElement.setAttribute('data-mode', 'adult')
          var t = document.querySelector('meta[name="theme-color"]')
          if (t) { t.setAttribute('data-normal', t.getAttribute('content')); t.setAttribute('content', '#141116') }
        } catch (e) { /* storage blocked: the page sets the theme itself */ }
      })()
    </script>
    <script>
      // Stale page during a deploy: this HTML may name the previous build's
      // entry script or stylesheet, now gone (404) — a blank page. Reload
      // (at most 3 times in 2 minutes, a little later each time) until the
      // new build's HTML comes back. Stands down once the app has started
      // (src/main.tsx); lazy chunks are handled by src/lib/lazyPage.ts.
      (function () {
        var KEY = 'dilchap_stale_build_reload'
        addEventListener('error', function (e) {
          var el = e.target
          if (window.__dilchapBooted || !el || !el.tagName) return
          var url = el.tagName === 'SCRIPT' ? el.src : el.tagName === 'LINK' ? el.href : ''
          if (!url || url.indexOf('/assets/') < 0) return
          var now = Date.now(), log
          try {
            log = JSON.parse(sessionStorage.getItem(KEY) || '[]').filter(function (t) { return now - t < 120000 })
            if (log.length >= 3) return
            log.push(now)
            sessionStorage.setItem(KEY, JSON.stringify(log))
          } catch (_) { return }
          setTimeout(function () { location.reload() }, (log.length - 1) * 10000)
        }, true)
      })()
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
