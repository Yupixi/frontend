<!-- App launcher icon source (1024px). Open in Chrome, screenshot #i (or use scripts/app-icon via Playwright), then downscale with Lanczos to public/icon-512.png, icon-192.png, apple-touch-icon.png (opaque, full-bleed: the OS applies its mask) and favicon.png (rounded). Keep glyphs within the 80% maskable safe circle. -->
<!doctype html><html><head>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block" rel="stylesheet">
<style>
  body{margin:0;background:transparent}
  #i{width:1024px;height:1024px;background:#FE0000;position:relative;overflow:hidden}
  #i::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.20),transparent 55%),radial-gradient(circle at 85% 100%,rgba(0,0,0,.16),transparent 60%)}
  canvas{position:absolute;inset:0}
</style></head><body>
<div id="i"><canvas id="c" width="1024" height="1024"></canvas></div>
<script>
document.fonts.load('800 100px "Plus Jakarta Sans"').then(() => {
  const c = document.getElementById('c').getContext('2d')
  const size = 600, font = `800 ${size}px "Plus Jakarta Sans"`
  c.font = font; c.fillStyle = '#fff'; c.textBaseline = 'alphabetic'
  const txt = 'dı', track = -size * 0.035
  const wd = c.measureText('d'), wi = c.measureText('ı')
  const total = wd.width + track + wi.width
  const md = c.measureText('d')
  const ascent = md.actualBoundingBoxAscent, descent = md.actualBoundingBoxDescent
  // centre the glyph block (d ascender top → baseline) vertically, a bit low to leave room for the dot
  const baseline = 512 + (ascent - descent) / 2 + 46
  let x = 512 - total / 2
  c.fillText('d', x, baseline)
  const xi = x + wd.width + track
  c.fillText('ı', xi, baseline)
  // tittle: the brand's green trust dot centred over the dotless i stem
  const mi = c.measureText('ı')
  const stemLeft = xi - mi.actualBoundingBoxLeft, stemRight = xi + mi.actualBoundingBoxRight
  const cx = (stemLeft + stemRight) / 2, stemW = stemRight - stemLeft
  const iTop = baseline - mi.actualBoundingBoxAscent
  const r = stemW * 0.62
  const cy = iTop - r - stemW * 0.42
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fillStyle = '#19D18B'; c.fill()
  document.body.dataset.ready = 1
})
</script></body></html>
